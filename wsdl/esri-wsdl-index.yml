note: >-
  ArcGIS Server exposes a SOAP Service Catalog alongside its REST directory, and Esri's hosted
  location-service hosts still serve it. Both documents were fetched live on 2026-09-07 (HTTP 200,
  text/xml) and saved VERBATIM — neither was authored or edited. Ownership is unambiguous: the
  targetNamespace is http://www.esri.com/schemas/ArcGIS/3.7.0 and each soap:address points back at
  the Esri host it was fetched from.
  SCOPE CAVEAT, stated plainly: this is the CATALOG service, not the geocoding or routing
  operations. It answers "what services live here and do they need a token", nothing more. The
  per-service WSDLs (e.g. .../World/GeocodeServer?wsdl) return HTTP 403 "The administrator has
  disabled the Service Directory", so the operation-level SOAP contracts are not published.
