source: >-
  registry.npmjs.org, pypi.org, api.nuget.org and the ArcGIS developer SDK reference
  (https://developers.arcgis.com/). Versions and dates read from each registry's metadata
  endpoint on 2026-09-07.
note: >-
  Esri ships first-party client libraries across JavaScript, Python and .NET. The core
  JavaScript mapping SDK (@arcgis/core) and its web-component families release on one
  version train (5.1.x, shipped 2026-09-03); the arcgis-rest-js service wrappers release
  separately (4.11.0, 2026-08-07). Every first-party package listed here has a release in
  the last two months — there is no SDK-abandonment signal for this provider. esri-loader
  is included as the one exception: it is a first-party package Esri has explicitly
  superseded by ES-module imports of @arcgis/core and has not released since 2022.
