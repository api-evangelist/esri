- aid: esri:esri-arcgis-ogc-services
  name: ArcGIS Server OGC Web Services
  description: ArcGIS Server publishes any map or feature service through the OGC interfaces - WMS, WFS,
    WCS, WMTS and KML. The two capabilities documents registered here were fetched from Esri's public
    ArcGIS Server sample deployment on arcgisonline.com and are the self-describing contracts of that
    interface; every production OGC endpoint is a customer deployment of the same product on the customer's
    own domain.
