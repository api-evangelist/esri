- aid: esri:esri-arcgis-urban-api
  name: ArcGIS Urban API
  description: A GraphQL API for ArcGIS Urban - urban models, plans, projects, branches, parcels, zones,
    spaces, building types, indicators, metrics, overlays, viewpoints and scenario analyses (elevation
    profile, line of sight, shadowcast, viewshed, suitability, sunlight). Anonymous introspection is open,
    so the full schema is machine-readable without a credential; executing queries requires an ArcGIS
    token.
  humanURL: https://developers.arcgis.com/arcgis-urban-api/
  baseURL: https://urban-api.arcgis.com/graphql
