  - version: '2026-07'
    date: '2026-07'
    url: https://location.arcgis.com/help/release-notes/2026-07/
    breaking:
      - >-
        API key (legacy) authentication has been fully retired. Only new-style API keys are
        supported going forward.
    additions:
      - >-
        ArcGIS Static Maps service promoted from beta to general availability.
      - >-
        MCP for ArcGIS Location Services (beta) — geocoding, routing, elevation and static maps
        exposed to AI agents over Model Context Protocol.
    updates:
      - >-
        ArcGIS GeoEnrichment service: annual US data update. Esri2024 retired; Esri 2026 added as
        the default current-year hierarchy; Esri 2025 becomes the previous-year hierarchy.
      - Documentation and FAQ updates.
    highlights: >-
      The release that made Esri an agent-callable provider: a hosted MCP endpoint plus the
      static-maps GA that one of its tools depends on.
