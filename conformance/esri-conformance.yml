standards:
  - id: oauth2
    conforms: true
    evidence: >-
      OpenAPI securitySchemes declare oauth2 (authorizationCode + clientCredentials) and the live
      /.well-known/oauth-authorization-server document at www.arcgis.com names
      authorization_endpoint https://www.arcgis.com/sharing/rest/oauth2/authorize and
      token_endpoint https://www.arcgis.com/sharing/rest/oauth2/token.
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: true
    evidence: >-
      https://www.arcgis.com/.well-known/oauth-authorization-server returns HTTP 200 with issuer,
      authorization_endpoint, token_endpoint, response_types_supported and grant_types_supported.
      Saved verbatim to well-known/esri-oauth-authorization-server.json.
  - id: rfc9728-oauth-protected-resource-metadata
    conforms: true
    evidence: >-
      https://location-services-mcp.arcgis.com/.well-known/oauth-protected-resource returns HTTP 200
      with resource + authorization_servers. Saved verbatim to
      well-known/esri-oauth-protected-resource.json.
  - id: rfc7636-pkce
    conforms: true
    evidence: 'code_challenge_methods_supported: ["S256"] in the authorization-server metadata document.'
  - id: mcp
    conforms: true
    version: Streamable HTTP transport
    evidence: >-
      Esri-hosted MCP server at https://location-services-mcp.arcgis.com/beta/mcp, documented at
      https://developers.arcgis.com/ai/mcp-arcgis-location-services/. Anonymous POST tools/list
      returns 401 "Token Required", confirming a live JSON-RPC endpoint behind auth.
  - id: oidc
    conforms: false
    evidence: >-
      /.well-known/openid-configuration returns 404 on every ArcGIS host probed; ArcGIS OAuth is
      OAuth 2.0 without an OIDC discovery document.
  - id: oauth2-scopes
    conforms: false
    evidence: >-
      The ArcGIS /oauth2/authorize endpoint has no scope parameter. Access is governed by
      account/credential PRIVILEGES rather than OAuth scopes — see scopes/esri-scopes.yml.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      ArcGIS uses a proprietary JSON error envelope, not application/problem+json. Observed live:
      {"error":{"code":499,"message":"Token Required.","details":[...]}}.
  - id: rest
    conforms: true
    evidence: HTTP+JSON resource APIs across all ArcGIS location and portal services (f=json/pjson).
