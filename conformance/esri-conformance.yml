domain_standards:
  note: >-
    REWARD-ONLY. The geospatial market's domain standards are the OGC suite and ISO/TC 211.
    Esri co-founded the OGC and implements OGC service interfaces broadly in ArcGIS Server,
    ArcGIS Enterprise and ArcGIS Online hosted feature layers. HOWEVER: no first-party
    Esri-operated OGC endpoint was probed for this record. OGC surfaces in the ArcGIS world are
    served from CUSTOMER tenants (services*.arcgis.com/<orgId>/..., or a customer's own
    ArcGIS Server), not from an Esri-operated base URL this profile owns, and probing a customer
    tenant would attribute a customer's contract to Esri. No conformsTo[] document and no
    *_Capabilities XML was fetched, so no OGC conformance is asserted here. This is a recorded
    gap, not a negative finding about Esri.
  entries: []
