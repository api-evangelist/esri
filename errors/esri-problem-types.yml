  reference https://developers.arcgis.com/rest/geoenrichment/error-codes/
format: proprietary-json
format_note: >-
  ArcGIS does NOT use RFC 9457 application/problem+json. Every service returns a proprietary JSON
  envelope, and — importantly for agents — it often returns it with HTTP 200. The error is carried
  in the body, not the status line.
envelope:
  shape: '{"error": {"code": <int>, "message": <string>, "details": [<string>, ...]}}'
  observed_live:
    url: https://location-services-mcp.arcgis.com/beta/mcp
    http_status: 401
    body: '{"error":{"code":499,"message":"Token Required.","details":["The required authentication information is missing. Unable to authorize access without a valid token."]}}'
    fetched: '2026-09-07'
  observed_live_2:
    url: https://places-api.arcgis.com/openapi.json
    http_status: 404
    body: '{"error":{"code":404,"message":"Path not found.","details":["The path: ''/openapi.json'' did not match any known endpoints."]}}'
    fetched: '2026-09-07'
  agent_warning: >-
    An agent must parse the body of a 200 response for an `error` key before treating the call as
    successful. ArcGIS's token errors historically surface as HTTP 200 with error.code 498/499 in
    the body on the classic REST endpoints; the newer location-service hosts do set a matching
    HTTP status.
