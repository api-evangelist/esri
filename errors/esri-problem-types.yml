service_error_registries:
  - service: GeoEnrichment
    url: https://developers.arcgis.com/rest/geoenrichment/error-codes/
    scheme: 8-digit extended error codes
    sample:
      - {code: 10020007, title: Parameter is invalid, cause: 'An unsupported value was used in one of the enrich request parameters (e.g. buffer radius of 0).'}
      - {code: 10040001, title: The number of study areas was exceeded, cause: 'studyAreas exceeds the service limit of 1000 features.'}
      - {code: 10040004, title: The maximum ring size was exceeded, cause: 'Ring buffer exceeds the 1000-mile service limit.'}
      - {code: 10040006, title: Service area exceeds limit, cause: 'Exceeds 300 miles drive distance, 300 minutes drive time, 27 miles walking distance or 540 walking minutes.'}
      - {code: 10050011, title: Unable to find hierarchy, cause: 'Invalid useData hierarchy — e.g. the retired esri2022 US hierarchy.'}
      - {code: 10050024, title: Variables are not defined, cause: 'Invalid value in analysisVariables.'}
      - {code: 10050025, title: Standard Geography IDs are invalid, cause: 'Invalid standard geography ID in studyAreas; the IDs are dropped from the output.'}
      - {code: 10050032, title: "Data collections or reports not associated", cause: 'The dataCollections/report ID does not exist.'}
      - {code: 20010404, title: Failed to format report, cause: Server error creating the report; retry later.}
      - {code: 20010604, title: Unable to detect country for study area, cause: 'The study area is not inside a country with data coverage.'}
      - {code: 10010021, title: Neither geographyIds nor geographyQuery specified, cause: 'Standard Geography Query requires one of the two.'}
