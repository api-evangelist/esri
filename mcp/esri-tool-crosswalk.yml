  ArcGIS REST operation captured in this repo's OpenAPI. The live tools/list is auth-gated
  (HTTP 401, "Token Required"), so bindings are made by name and documented semantics
  against Esri's published tools reference, never by introspected inputSchema — confidence
  is set accordingly. The captured OpenAPI covers only the geocoding, routing and OAuth
  token surfaces, so the elevation, static-maps and GeoEnrichment tools have no counterpart
  operation IN THIS REPO; that is a gap in our spec coverage, not an MCP-only capability of
  Esri's, and each row says so.
